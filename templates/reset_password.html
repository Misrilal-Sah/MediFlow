{% extends "base.html" %}
{% block title %}Reset Password | MediFlow{% endblock %}
{% block topbar %}{% endblock %}
{% block page_title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-card glass reveal">
  <h2>Set a new password</h2>
  <p class="muted" style="margin-bottom:20px">Choose a strong password (min. 8 characters).</p>
  <form method="POST" class="form-grid">
    <div>
      <label>New Password</label>
      <div style="position:relative">
        <input type="password" name="password" placeholder="New password" required minlength="8" autocomplete="new-password" style="padding-right:42px">
        <button type="button" class="pwd-eye" tabindex="-1" aria-label="Toggle password visibility">
          <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <div>
      <label>Confirm Password</label>
      <div style="position:relative">
        <input type="password" name="confirm_password" placeholder="Repeat password" required minlength="8" autocomplete="new-password" style="padding-right:42px">
        <button type="button" class="pwd-eye" tabindex="-1" aria-label="Toggle password visibility">
          <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <div>
      <button class="btn-primary ripple" type="submit" style="width:100%">Reset Password</button>
    </div>
  </form>
</div>
{% endblock %}
