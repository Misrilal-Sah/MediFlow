{% extends "base.html" %}
{% block title %}Signup | MediFlow{% endblock %}
{% block topbar %}{% endblock %}
{% block page_title %}Create Account{% endblock %}

{% block content %}
<section class="auth-card glass reveal">
  <h2>Signup</h2>
  <form method="POST" class="form-grid two-col">
    <div>
      <label>First Name</label>
      <input type="text" name="first_name" required>
    </div>
    <div>
      <label>Last Name</label>
      <input type="text" name="last_name" required>
    </div>
    <div class="full">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>
    <div>
      <label>Phone</label>
      <input type="text" name="phone" required>
    </div>
    <div>
      <label>Password</label>
      <div style="position:relative">
        <input type="password" name="password" id="signupPassword" required autocomplete="new-password" style="padding-right:42px">
        <button type="button" class="pwd-eye" tabindex="-1" aria-label="Toggle password visibility">
          <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <div class="full">
      <button class="btn-primary" type="submit">Create Account</button>
    </div>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
