{% extends "base.html" %}
{% block title %}Add Patient | MediFlow{% endblock %}
{% block page_title %}Add Patient{% endblock %}
{% block content %}
<section class="panel glass reveal">
  <form method="POST" class="form-grid two-col">
    <div class="full"><label>Name</label><input type="text" name="name" required></div>
    <div><label>Age</label><input type="number" name="age" min="0" required></div>
    <div>
      <label>Gender</label>
      <select name="gender" required>
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="full"><label>Phone</label><input type="text" name="phone" required></div>
    <div class="full"><button class="btn-primary" type="submit">Save Patient</button></div>
  </form>
</section>
{% endblock %}
