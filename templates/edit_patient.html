{% extends "base.html" %}
{% block title %}Edit Patient | MediFlow{% endblock %}
{% block page_title %}Edit Patient{% endblock %}
{% block content %}
<section class="panel glass reveal">
  <form method="POST" class="form-grid two-col">
    <div class="full"><label>Name</label><input type="text" name="name" value="{{ patient[1] }}" required></div>
    <div><label>Age</label><input type="number" name="age" value="{{ patient[2] }}" required></div>
    <div>
      <label>Gender</label>
      <select name="gender" required>
        <option value="Male" {% if patient[3]=='Male' %}selected{% endif %}>Male</option>
        <option value="Female" {% if patient[3]=='Female' %}selected{% endif %}>Female</option>
        <option value="Other" {% if patient[3]=='Other' %}selected{% endif %}>Other</option>
      </select>
    </div>
    <div class="full"><label>Phone</label><input type="text" name="phone" value="{{ patient[4] }}" required></div>
    <div class="full"><button class="btn-primary" type="submit">Update Patient</button></div>
  </form>
</section>
{% endblock %}
